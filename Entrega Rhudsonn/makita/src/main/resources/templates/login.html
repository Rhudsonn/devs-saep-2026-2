<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary">

<div class="container-fluid vh-100">
    <div class="row h-100 align-items-center justify-content-center">
        <div class="col-12 col-lg-10 col-xl-8">
            <div class="row align-items-center">

                <!-- Lado esquerdo: Logo -->
                <div class="col-12 col-md-6 text-center border-end border-light border-opacity-25 py-5">
                    <h1 class="display-3 text-white fw-bold mb-2">
                        Makita
                    </h1>
                    <h6 class="text-white">
                        Zheiri Solutions <span class="fs-6 align-baseline">&reg;</span>
                    </h6>
                </div>

                <!-- Lado direito: Formulário -->
                <div class="col-12 col-md-6 py-5 px-5">
                    <h3 class="text-white mb-4">Login</h3>

                    <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="Digite seu e-mail" required>
                        </div>

                        <div class="mb-3">
                            <input type="password" class="form-control" id="senha" name="senha"
                                   placeholder="Digite sua senha" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="#" class="text-white fst-italic text-decoration-none small">Esqueci minha senha</a>

                            <button type="submit" class="btn btn-link text-white text-decoration-none fw-semibold fs-5">
                                Entrar &raquo;
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
