<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 05 — Demo ao Vivo · Arquitetura da Tela Principal e Navegação</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#0f172a; --panel:#17223b; --panel-2:#1d2b4a; --ink:#e7ecf6; --ink-soft:#9fb0cf;
    --orange:#e2622b; --brass:#c99a52; --steel:#6f8fc7; --ok:#4caf7d; --bad:#e2622b;
    --line:#2a3a5c; --paper:#fbf7ec; --paper-ink:#2b2620;
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;}
  .hdr{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);}
  .hdr b{color:var(--orange); font-family:'Oswald',sans-serif; letter-spacing:.04em;}
  .layout{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); min-height:calc(100vh - 168px);}
  .pane{background:var(--bg); padding:22px 26px; overflow:auto;}
  .pane h3{margin:0 0 14px; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:13px; letter-spacing:.08em; color:var(--brass);}
  .editor{background:#0a1120; border:1px solid var(--line); border-radius:10px; padding:18px 20px; font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.75; min-height:360px; white-space:pre-wrap; color:#d7e2f5;}
  .editor .cursor{display:inline-block; width:7px; height:15px; background:var(--orange); animation:blink 1s step-end infinite; vertical-align:middle;}
  @keyframes blink{50%{opacity:0;}}
  .preview{background:var(--paper); color:var(--paper-ink); border-radius:10px; padding:24px 26px; min-height:360px; font-family:'IBM Plex Sans',sans-serif;}
  .preview.dark{background:#0a1120; color:#d7e2f5; font-family:'IBM Plex Mono',monospace; font-size:13px; white-space:pre-wrap; line-height:1.7;}
  .preview h4{margin:0 0 4px; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:15px;}
  .preview .sub{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7a7259; margin-bottom:16px;}
  table.reqs{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.reqs th, table.reqs td{border:1px solid #cabd9a; padding:8px 10px; text-align:left;}
  table.reqs th{background:#e2d5b6; font-family:'Oswald',sans-serif; font-size:11px; text-transform:uppercase;}
  table.reqs td.id{font-family:'IBM Plex Mono',monospace; color:#a87c3f; white-space:nowrap;}
  .prio{font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:2px 8px; border-radius:20px;}
  .prio.alta{background:#f2d3c8; color:#a3401a;}
  .prio.media{background:#efe4c3; color:#8a6a1c;}
  .prio.ok{background:#d7ecdd; color:#1f6b3d;}
  .empty{color:#8b8368; font-size:13px; font-style:italic;}
  .narration{background:var(--panel); border-top:1px solid var(--line); padding:16px 28px; font-size:14px; color:var(--ink-soft); min-height:26px;}
  .controls{display:flex; align-items:center; gap:12px; padding:14px 28px; border-top:1px solid var(--line);}
  .controls button{background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:10px 16px; border-radius:8px; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; cursor:pointer;}
  .controls button.main{background:var(--orange); border-color:var(--orange); color:#2a0a02; font-weight:600;}
  .controls button:disabled{opacity:.4; cursor:not-allowed;}
  .bar{flex:1; height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; width:0%; background:var(--orange); transition:width .25s ease;}
  .stepnum{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--brass); min-width:64px; text-align:right;}
  .navfoot{display:flex; justify-content:space-between; padding:14px 28px; border-top:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .navfoot a{color:var(--brass); text-decoration:none;}
  footer.credit{position:fixed; bottom:6px; right:14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--line);}
</style>
</head>
<body>

<div class="hdr">
  <div><b>AULA 05</b> · Demo ao vivo — Montando o hub de navegação</div>
  <div>Editor → Preview</div>
</div>

<div class="layout">
  <div class="pane">
    <h3>Editor</h3>
    <div class="editor" id="editor"><span class="cursor"></span></div>
  </div>
  <div class="pane">
    <h3>Preview</h3>
    <div class="preview" id="previewBox">
      <h4>Interface Principal</h4>
      <div class="sub">hub de navegação do sistema</div>
      <table class="reqs" id="reqTable">
        <thead><tr><th>Etapa</th><th>Resultado</th></tr></thead>
        <tbody id="reqBody"><tr><td colspan="2" class="empty">Aguardando digitação...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="narration" id="narration"></div>

<div class="controls">
  <span class="stepnum" id="stepnum"></span>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <button id="prevBtn" onclick="prevStep()">← Anterior</button>
  <button id="playBtn" class="main" onclick="playStep()">▶ Iniciar digitação</button>
  <button id="nextBtn" onclick="nextStep()">Próxima →</button>
</div>

<div class="navfoot">
  <a href="a05_exposicao.html">← Exposição</a>
  <a href="a05_pratica_guiada.html">Prática Guiada →</a>
</div>

<footer class="credit">Prof(a). Karize Viecelli · @karizeviecelli</footer>

<script>
const PREVIEW_KIND = "table";
const steps = [{"narration": "Passo 1 de 4 — lendo a sessão criada no login.", "code": "sessao.usuario = { id: 1, nome: 'Ana Souza' }", "rows": [{"cells": ["Sessão", "usuario carregado a partir do login"]}]}, {"narration": "Passo 2 de 4 — exibindo o nome na tela principal.", "code": "\n\n<h2>Bem-vindo(a), { sessao.usuario.nome }</h2>", "rows": [{"cells": ["Exibição", "'Bem-vindo(a), Ana Souza'"]}]}, {"narration": "Passo 3 de 4 — criando os dois acessos de navegação.", "code": "\n\n<button onclick=\"ir('cadastro-produto')\">Cadastro de Produto</button>\n<button onclick=\"ir('gestao-estoque')\">Gestão de Estoque</button>", "rows": [{"cells": ["Navegação", "2 acessos criados (placeholders)"]}]}, {"narration": "Passo 4 de 4 — implementando o logout.", "code": "\n\nfunção logout() {\n  sessao.usuario = null;\n  navegar('login');\n}", "rows": [{"cells": ["Logout", "sessão limpa, retorno ao login"]}]}];

let current = 0;
let typing = false;

function renderRowsTable(upToStep){
  const body = document.getElementById('reqBody');
  if(!body) return;
  let all = [];
  for(let i=0;i<=upToStep;i++){ all = all.concat(steps[i].rows || []); }
  if(all.length===0){
    body.innerHTML = '<tr><td colspan="10" class="empty">Aguardando digitação...</td></tr>';
    return;
  }
  body.innerHTML = all.map(r => '<tr>' + r.cells.map((c,idx)=> idx===0 ? `<td class="id">${c}</td>` : (r.prio && idx===r.cells.length-1 ? `<td><span class="prio ${r.prio}">${c}</span></td>` : `<td>${c}</td>`)).join('') + '</tr>').join('');
}

function renderCodePreview(upToStep){
  const box = document.getElementById('previewBox');
  if(!box) return;
  box.textContent = steps[upToStep].preview || '';
}

function renderPreview(upToStep){
  if(PREVIEW_KIND === 'table'){ renderRowsTable(upToStep); } else { renderCodePreview(upToStep); }
}

function typeText(text, cb){
  const editor = document.getElementById('editor');
  let base = '';
  for(let i=0;i<current;i++){ base += steps[i].code; }
  let i = 0;
  typing = true;
  setPlayingUI(true);
  function tick(){
    if(i <= text.length){
      const chunk = text.slice(0,i);
      editor.innerHTML = escapeHtml(base+chunk) + '<span class="cursor"></span>';
      editor.scrollTop = editor.scrollHeight;
      const ch = text[i-1];
      let delay = 28;
      if(ch === '\n') delay = 60;
      else if(ch === ' ') delay = 20;
      else delay = 18 + Math.random()*25;
      i++;
      setTimeout(tick, delay);
    } else {
      typing = false;
      setPlayingUI(false);
      renderPreview(current);
      cb && cb();
    }
  }
  tick();
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setPlayingUI(isPlaying){
  document.getElementById('playBtn').textContent = isPlaying ? '⏳ Digitando...' : '↻ Rever';
  document.getElementById('playBtn').disabled = isPlaying;
  document.getElementById('prevBtn').disabled = isPlaying;
  document.getElementById('nextBtn').disabled = isPlaying;
}

function updateChrome(){
  document.getElementById('narration').textContent = steps[current].narration;
  document.getElementById('stepnum').textContent = `${current+1} / ${steps.length}`;
  document.getElementById('barFill').style.width = `${((current+1)/steps.length)*100}%`;
  document.getElementById('playBtn').textContent = '▶ Iniciar digitação';
  document.getElementById('playBtn').disabled = false;
}

function setEditorToStep(stepIdx){
  const editor = document.getElementById('editor');
  let base = '';
  for(let i=0;i<stepIdx;i++){ base += steps[i].code; }
  editor.innerHTML = escapeHtml(base) + '<span class="cursor"></span>';
}

function playStep(){
  if(typing) return;
  typeText(steps[current].code);
}

function nextStep(){
  if(typing) return;
  if(current < steps.length-1){
    current++;
    updateChrome();
    setEditorToStep(current);
    renderPreview(current-1);
  }
}
function prevStep(){
  if(typing) return;
  if(current > 0){
    current--;
    updateChrome();
    setEditorToStep(current);
    renderPreview(current-1);
  }
}

updateChrome();
</script>
</body>
</html>
