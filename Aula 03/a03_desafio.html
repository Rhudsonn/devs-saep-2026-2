<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 03 — Desafio · SQL: DDL/DML, Chaves Primárias e Estrangeiras</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#0f172a; --panel:#17223b; --panel-2:#1d2b4a; --ink:#e7ecf6; --ink-soft:#9fb0cf;
    --orange:#e2622b; --brass:#c99a52; --steel:#6f8fc7; --ok:#4caf7d; --bad:#e2622b;
    --line:#2a3a5c; --paper:#fbf7ec; --paper-ink:#2b2620;
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;}
  .hdr{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);}
  .hdr b{color:var(--orange); font-family:'Oswald',sans-serif; letter-spacing:.04em;}
  .wrap{max-width:720px; margin:0 auto; padding:40px 24px 100px; text-align:center;}
  .timer{font-family:'Oswald',sans-serif; font-weight:700; font-size:clamp(56px,10vw,96px); letter-spacing:.02em; margin:18px 0 6px; transition:color .3s;}
  .timer.warn{color:var(--orange); animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.5;}}
  .timer-label{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); letter-spacing:.1em; text-transform:uppercase; margin-bottom:24px;}
  .timer-controls{display:flex; justify-content:center; gap:12px; margin-bottom:40px;}
  .timer-controls button{background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:10px 20px; border-radius:8px; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; cursor:pointer;}
  .timer-controls button.main{background:var(--orange); border-color:var(--orange); color:#2a0a02; font-weight:600;}
  .checklist{text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px;}
  .item{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-radius:8px; cursor:pointer;}
  .item:hover{background:var(--panel-2);}
  .item input{margin-top:3px; width:18px; height:18px; accent-color:var(--orange); cursor:pointer;}
  .item span{font-size:14.5px; line-height:1.5;}
  .item.checked span{color:var(--ink-soft); text-decoration:line-through;}
  .summary{display:none; margin-top:28px; background:var(--panel); border:1px solid var(--ok); border-radius:12px; padding:24px;}
  .summary.show{display:block;}
  .summary h3{margin:0 0 8px; font-family:'Oswald',sans-serif; color:var(--ok); text-transform:uppercase;}
  .summary p{color:var(--ink-soft); font-size:14px; line-height:1.6; margin:0;}
  .navfoot{display:flex; justify-content:space-between; padding:14px 28px; border-top:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:12px; position:fixed; bottom:0; left:0; right:0; background:var(--bg);}
  .navfoot a{color:var(--brass); text-decoration:none;}
  footer.credit{position:fixed; bottom:44px; right:14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--line);}
</style>
</head>
<body>

<div class="hdr">
  <div><b>AULA 03</b> · Desafio Autônomo</div>
  <div>20 min · trabalho individual</div>
</div>

<div class="wrap">
  <div class="timer-label">Tempo restante</div>
  <div class="timer" id="timerDisplay">20:00</div>
  <div class="timer-controls">
    <button class="main" onclick="timerClick()" id="timerBtn">Iniciar</button>
    <button onclick="timerReset()">Zerar</button>
  </div>

  <div class="checklist" id="checklist">
    <label class="item"><input type="checkbox" onchange="toggleItem(this)"><span>O banco está nomeado exatamente como 'saep_db'.</span></label>
    <label class="item"><input type="checkbox" onchange="toggleItem(this)"><span>As 3 tabelas existem com todas as colunas do DER.</span></label>
    <label class="item"><input type="checkbox" onchange="toggleItem(this)"><span>Toda tabela tem uma chave primária definida.</span></label>
    <label class="item"><input type="checkbox" onchange="toggleItem(this)"><span>As chaves estrangeiras de movimentacao apontam corretamente para produto e usuario.</span></label>
    <label class="item"><input type="checkbox" onchange="toggleItem(this)"><span>Cada tabela tem pelo menos 3 registros inseridos.</span></label>
    <label class="item"><input type="checkbox" onchange="toggleItem(this)"><span>O script roda do início ao fim sem erro em um banco limpo.</span></label>
  </div>

  <div class="summary" id="summary">
    <h3>✓ Entrega concluída</h3>
    <p>O saep_db está de pé e populado. Ele será a base de tudo o que vem a seguir: login, cadastro de produto e gestão de estoque.</p>
  </div>
</div>

<div class="navfoot">
  <a href="a03_pratica_guiada.html">← Prática Guiada</a>
  <a href="a03_feedback.html">Feedback →</a>
</div>

<footer class="credit">Prof(a). Karize Viecelli · @karizeviecelli</footer>

<script>
  let totalSeconds = 1200;
  let remaining = totalSeconds;
  let interval = null;
  let running = false;

  function render(){
    const m = Math.floor(remaining/60).toString().padStart(2,'0');
    const s = (remaining%60).toString().padStart(2,'0');
    const disp = document.getElementById('timerDisplay');
    disp.textContent = `${m}:${s}`;
    disp.classList.toggle('warn', remaining <= 300);
  }

  function timerClick(){
    const btn = document.getElementById('timerBtn');
    if(!running){
      running = true;
      btn.textContent = 'Pausar';
      interval = setInterval(()=>{
        if(remaining > 0){
          remaining--;
          render();
        } else {
          clearInterval(interval);
          running = false;
          btn.textContent = 'Iniciar';
        }
      },1000);
    } else {
      running = false;
      btn.textContent = 'Retomar';
      clearInterval(interval);
    }
  }

  function timerReset(){
    clearInterval(interval);
    running = false;
    remaining = totalSeconds;
    document.getElementById('timerBtn').textContent = 'Iniciar';
    render();
  }

  function toggleItem(cb){
    cb.closest('.item').classList.toggle('checked', cb.checked);
    checkAllDone();
  }

  function checkAllDone(){
    const all = document.querySelectorAll('.item input');
    const checked = document.querySelectorAll('.item input:checked');
    document.getElementById('summary').classList.toggle('show', all.length === checked.length);
  }

  render();
</script>
</body>
</html>
